name: Sync & Filter Sources

on:
  # 每周一自动运行
  schedule:
    - cron: "0 0 * * 1"
  # 也可以手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  filter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync from upstream
        run: |
          git remote add upstream https://github.com/LittleSurvival/copymanga-copy20.git || true
          git fetch upstream
          git checkout main
          git merge upstream/main --no-edit --strategy-option=theirs || true
          # 确保 repo 分支的文件同步到 main
          git checkout upstream/repo -- index.min.json index.json apk/ icon/ repo.json 2>/dev/null || true

      - name: Filter dead sources
        run: node scripts/filter_sources.mjs index.min.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.min.json index.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "自动过滤: 移除不可访问的源 [skip ci]"
            git push
          fi
